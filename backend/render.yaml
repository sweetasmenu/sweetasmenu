# Render Blueprint Specification
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sweetasmenu-api
    runtime: python
    buildCommand: ./build.sh
    startCommand: uvicorn main_ai:app --host 0.0.0.0 --port $PORT
    region: singapore
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ENVIRONMENT
        value: production
